name: Deploy

# Publishes the built game to GitHub Pages.
#
# One-time setup, once this file is on the default branch:
#   repo Settings → Pages → Build and deployment → Source: "GitHub Actions"
# Until that is set, this workflow fails at the "Configure Pages" step.
#
# Pushes to main deploy automatically. Use "Run workflow" on the Actions tab to
# deploy any other branch by hand — handy for previewing a milestone before it
# merges.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it — a half-published
# site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Never publish a build that does not typecheck or pass the rules tests.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npx vite build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
